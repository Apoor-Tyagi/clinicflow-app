name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: clinicflow-api

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: clinicflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d clinicflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: ci-throwaway
      TENANT_TEST_ADMIN_URL: postgresql://ci_admin:ci-throwaway@localhost:5432/clinicflow
      TENANT_TEST_APP_URL: postgresql://clinicflow_app:ci-app-throwaway@localhost:5432/clinicflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U ci_admin -d clinicflow -v ON_ERROR_STOP=1 -f db/migrations/001_tenant_model.sql
          psql -h localhost -U ci_admin -d clinicflow -v ON_ERROR_STOP=1 -c "ALTER ROLE clinicflow_app PASSWORD 'ci-app-throwaway'"

      - name: Run tests
        run: python -m pytest -q -rs
  build-scan:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image (amd64) for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: clinicflow-api:ci

      - name: Trivy scan (fail on fixable HIGH or CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            clinicflow-api:ci

  push:
    needs: [test, build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
